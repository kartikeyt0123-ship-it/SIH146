# Render Blueprint.
#
# Render is used here because its free tier needs no payment card, builds the Dockerfile
# directly, and signs in with the GitHub account that already hosts this repository.
#
# Free-tier limits worth knowing before you rely on this link:
#   * The service sleeps after 15 minutes without traffic and takes roughly a minute to
#     wake. The first visitor after a quiet period waits.
#   * There is no persistent disk. Saved cases are cleared whenever the service
#     restarts. The application works fully; it just does not remember.
#   * 512 MB of RAM. The small demo file analyses comfortably. The full 10,000-row
#     dataset may exhaust memory - run that one locally, or upgrade the instance.
services:
  - type: web
    name: chainlens
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore          # nearest free region to India
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Open demonstration: no login, so a judge clicking the link on a slide lands
      # straight in the application.
      #
      # This is a deliberate waiver of the startup interlock, not a missing password.
      # Anyone with the URL can upload files, read every case on the instance and
      # export evidence from it, so nothing real belongs here. To require a login
      # instead, delete this key and add:
      #     - key: CHAINLENS_AUTH_PASSWORD
      #       sync: false
      - key: CHAINLENS_PUBLIC_DEMO
        value: "1"
      # Generated once by Render and kept across deploys, so sessions survive a restart.
      - key: CHAINLENS_SESSION_SECRET
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      # Free instances have no mounted disk; /tmp is writable but not persistent.
      - key: CHAINLENS_DATA_DIR
        value: /tmp/chainlens_data
